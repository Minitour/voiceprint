[project]
name = "voiceprint"
version = "0.1.0"
description = "A personal n-gram model of your own writing, used to flag and fix words in a draft that don't sound like you."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wordfreq>=3.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
wordnet = ["nltk>=3.8"]
dev = ["pytest>=8", "nltk>=3.8"]

[project.scripts]
voiceprint = "voiceprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceprint"]
