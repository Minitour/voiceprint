<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">How voiceprint works</title><desc id="d">Build a voice index from your writing once, then check each agent draft against it, revise the flagged words using your own vocabulary, and re-check until it passes.</desc><style>
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
.muted { fill: #64748b; }
.b { font-weight: 700; }
.sb { font-weight: 600; }
.title { font-size: 26px; font-weight: 750; }
.sub { font-size: 14px; fill: #64748b; }
.h { font-size: 15px; font-weight: 700; }
.lane { font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.arrow { stroke: #0f172a; stroke-width: 1.6; fill: none; }
.arrow-m { stroke: #64748b; stroke-width: 1.4; fill: none; }
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="1" y="1" width="1198" height="678" rx="18" fill="#ffffff" stroke="#e2e8f0"/><text x="40" y="52" font-size="13" text-anchor="start" class="title">How voiceprint works</text><text x="40" y="78" font-size="13" text-anchor="start" class="sub">Build a model of your writing once. Check every draft an agent writes against it.</text><rect x="24" y="100" width="1152" height="196" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="44" y="126" font-size="13" text-anchor="start" class="lane" fill="#2563eb" style="fill:#2563eb">1  BUILD  ·  ONCE</text><rect x="44" y="142" width="196" height="134" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/><rect x="64" y="156" width="26" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="70" y="162" width="26" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="76" y="168" width="26" height="32" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="108" y="172" font-size="15" text-anchor="start" class="h">Your writing</text><text x="108" y="191" font-size="12" text-anchor="start" class="muted">anything you wrote</text><rect x="60" y="212" width="32" height="20" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="76.0" y="225.96" font-size="11" text-anchor="middle" class="mono" fill="#64748b" style="fill:#64748b">.md</text><rect x="98" y="212" width="39" height="20" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="117.5" y="225.96" font-size="11" text-anchor="middle" class="mono" fill="#64748b" style="fill:#64748b">.txt</text><rect x="143" y="212" width="46" height="20" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="166.0" y="225.96" font-size="11" text-anchor="middle" class="mono" fill="#64748b" style="fill:#64748b">.docx</text><rect x="60" y="238" width="39" height="20" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="79.5" y="251.96" font-size="11" text-anchor="middle" class="mono" fill="#64748b" style="fill:#64748b">.pdf</text><rect x="105" y="238" width="39" height="20" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="124.5" y="251.96" font-size="11" text-anchor="middle" class="mono" fill="#64748b" style="fill:#64748b">.tex</text><rect x="150" y="238" width="39" height="20" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="169.5" y="251.96" font-size="11" text-anchor="middle" class="mono" fill="#64748b" style="fill:#64748b">.rst</text><rect x="276" y="142" width="262" height="134" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/><text x="292" y="168" font-size="15" text-anchor="start" class="h">Clean &amp; tokenize</text><text x="292" y="190" font-size="11" text-anchor="start" class="muted">before</text><text x="292" y="207" font-size="12" text-anchor="start" class="mono">Read **notes** 2 at https://x.io</text><text x="292" y="232" font-size="11" text-anchor="start" class="muted">after</text><text x="292" y="249" font-size="12" text-anchor="start" xml:space="preserve"><tspan class="mono">read notes </tspan><tspan class="mono" style="fill:#2563eb">&lt;num&gt;</tspan><tspan class="mono"> at </tspan><tspan class="mono" style="fill:#2563eb">&lt;url&gt;</tspan></text><text x="292" y="266" font-size="11" text-anchor="start" class="muted">markup, code, links and numbers removed</text><rect x="574" y="142" width="336" height="134" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/><text x="590" y="168" font-size="15" text-anchor="start" class="h">Learn your habits</text><circle cx="596" cy="192" r="4" fill="#2563eb"/><text x="608" y="196" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan font-weight="600">Word sequences</tspan><tspan style="fill:#64748b">  which word you put after which</tspan></text><circle cx="596" cy="218" r="4" fill="#2563eb"/><text x="608" y="222" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan font-weight="600">Style</tspan><tspan style="fill:#64748b">  sentence length, punctuation, we/I</tspan></text><circle cx="596" cy="244" r="4" fill="#2563eb"/><text x="608" y="248" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan font-weight="600">Calibration</tspan><tspan style="fill:#64748b">  how surprising your own new text is</tspan></text><path d="M950,156 V254 A96,14 0 0 0 1142,254 V156" fill="#2563eb" /><ellipse cx="1046" cy="156" rx="96" ry="14" fill="#3b82f6"/><text x="1046" y="206" font-size="17" text-anchor="middle" class="mono b" fill="#ffffff" style="fill:#ffffff">voice.vpi</text><text x="1046" y="228" font-size="12.5" text-anchor="middle" fill="#dbeafe" style="fill:#dbeafe">your voice index</text><path d="M240,209 H272" class="arrow" marker-end="url(#ah)"/><path d="M538,209 H570" class="arrow" marker-end="url(#ah)"/><path d="M910,209 H946" class="arrow" marker-end="url(#ah)"/><rect x="24" y="316" width="1152" height="340" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/><text x="44" y="342" font-size="13" text-anchor="start" class="lane" fill="#b45309" style="fill:#b45309">2  CHECK  ·  EVERY DRAFT</text><path d="M1046,270 V300 H471 V362" class="arrow-m" marker-end="url(#ahm)"/><text x="760" y="293" font-size="11.5" text-anchor="middle" class="muted">compares against your voice index</text><rect x="44" y="362" width="248" height="124" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/><text x="60" y="388" font-size="15" text-anchor="start" class="h">Agent writes a draft</text><text x="60" y="414" font-size="13.5" text-anchor="start" font-style="italic">“Furthermore, this update</text><text x="60" y="434" font-size="13.5" text-anchor="start" font-style="italic">seamlessly leverages a</text><text x="60" y="454" font-size="13.5" text-anchor="start" font-style="italic">robust cache.”</text><rect x="330" y="362" width="282" height="124" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="471" y="390" font-size="16" text-anchor="middle" class="mono b">voiceprint check</text><text x="471" y="414" font-size="12.5" text-anchor="middle" class="muted">for every word in the draft:</text><text x="471" y="434" font-size="13" text-anchor="middle" class="sb">would you have written it,</text><text x="471" y="454" font-size="13" text-anchor="middle" class="sb">here, this often?</text><path d="M292,424 H326" class="arrow" marker-end="url(#ah)"/><rect x="330" y="528" width="282" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="471" y="550" font-size="12.5" text-anchor="middle" class="sb">General English word frequencies</text><text x="471" y="568" font-size="11.5" text-anchor="middle" class="muted">separates “you avoid it” from “it’s just rare”</text><path d="M471,528 V490" class="arrow-m" marker-end="url(#ahm)"/><rect x="650" y="362" width="318" height="186" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1"/><text x="666" y="388" font-size="15" text-anchor="start" class="h">Flags, fixed with your own words</text><rect x="666" y="402" width="46" height="19" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="689" y="416" font-size="10.5" text-anchor="middle" class="b" fill="#dc2626" style="fill:#dc2626">HIGH</text><text x="722" y="416" font-size="13" text-anchor="start" xml:space="preserve"><tspan style="fill:#dc2626" text-decoration="line-through">Furthermore,</tspan><tspan style="fill:#64748b">  →  </tspan><tspan style="fill:#15803d" font-weight="600">(delete)</tspan></text><rect x="666" y="428" width="46" height="19" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="689" y="442" font-size="10.5" text-anchor="middle" class="b" fill="#dc2626" style="fill:#dc2626">HIGH</text><text x="722" y="442" font-size="13" text-anchor="start" xml:space="preserve"><tspan style="fill:#dc2626" text-decoration="line-through">seamlessly</tspan><tspan style="fill:#64748b">  →  </tspan><tspan style="fill:#15803d" font-weight="600">simply</tspan></text><rect x="666" y="454" width="46" height="19" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="689" y="468" font-size="10.5" text-anchor="middle" class="b" fill="#dc2626" style="fill:#dc2626">HIGH</text><text x="722" y="468" font-size="13" text-anchor="start" xml:space="preserve"><tspan style="fill:#dc2626" text-decoration="line-through">leverages</tspan><tspan style="fill:#64748b">  →  </tspan><tspan style="fill:#15803d" font-weight="600">uses</tspan></text><rect x="666" y="480" width="46" height="19" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1"/><text x="689" y="494" font-size="10.5" text-anchor="middle" class="b" fill="#b45309" style="fill:#b45309">LOW</text><text x="722" y="494" font-size="13" text-anchor="start" xml:space="preserve"><tspan style="fill:#dc2626" text-decoration="line-through">robust</tspan><tspan style="fill:#64748b">  →  </tspan><tspan style="fill:#15803d" font-weight="600">simple</tspan></text><line x1="666" y1="510" x2="952" y2="510" stroke="#e2e8f0" stroke-width="1"/><text x="666" y="532" font-size="13" text-anchor="start" xml:space="preserve"><tspan style="fill:#64748b">verdict  </tspan><tspan style="fill:#dc2626" font-weight="700">does not sound like you</tspan></text><path d="M612,424 H646" class="arrow" marker-end="url(#ah)"/><path d="M809,548 V612 H168 V490" class="arrow" marker-end="url(#ah)"/><rect x="390" y="600" width="196" height="24" rx="4" fill="#fffbeb" stroke="#fffbeb" stroke-width="1"/><text x="488" y="617" font-size="12.5" text-anchor="middle" class="sb" fill="#b45309" style="fill:#b45309">agent revises, then re-checks</text><rect x="1004" y="362" width="156" height="186" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/><text x="1082" y="392" font-size="17" text-anchor="middle" class="b" fill="#15803d" style="fill:#15803d">Pass ✓</text><text x="1082" y="412" font-size="12.5" text-anchor="middle" class="muted">sounds like you</text><text x="1082" y="446" font-size="13.5" text-anchor="middle" font-style="italic">“This update</text><text x="1082" y="466" font-size="13.5" text-anchor="middle" font-style="italic">uses a simple</text><text x="1082" y="486" font-size="13.5" text-anchor="middle" font-style="italic">cache.”</text><text x="1082" y="532" font-size="11.5" text-anchor="middle" class="muted">0 high flags</text><path d="M968,455 H1000" class="arrow" marker-end="url(#ah)"/></svg>
