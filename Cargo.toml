[package]
name = "voiceprint"
version = "0.1.0"
edition = "2021"
description = "Let agents write like you: a personal n-gram model that flags words in a draft you wouldn't have written"
license = "MIT"
repository = "https://github.com/Minitour/voiceprint"
readme = "README.md"
keywords = ["writing", "style", "llm", "agents", "n-gram"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**", "data/*.gz", "data/*.txt", "data/NOTICE.md", "README.md", "LICENSE", "Cargo.toml"]

[[bin]]
name = "voiceprint"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
gag = "1"
glob = "0.3"
pdf-extract = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
